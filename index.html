<!doctype html>
<html lang="vi" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Đọc truyện">
<meta name="format-detection" content="telephone=no">
<title>Đọc truyện</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* ===== Màu: chủ đề (giấy / sáng / nâu / tối / đen) × màu nhấn ===== */
  :root {
    --bg: #f6f1e7; --card: #fffdf8; --text: #2b2620; --muted: #877d70; --line: #e7dfd0; --field: #efe8da;
    --read-bg: #fbf6ec; --read-text: #2e2922;
    --accent: #b5543c; --on-accent: #fff; --err: #b3392f;
    --accent-soft: var(--field);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    /* trang đọc (đổi trong Cài đặt) */
    --rfont: ui-serif, "New York", "Noto Serif", "Times New Roman", serif;
    --fs: 19px; --lh: 1.75; --ps: .8em; --pad: 20px; --align: left; --indent: 0;
    color-scheme: light;
  }
  :root[data-theme="light"] { --bg: #f2f3f5; --card: #fff; --text: #1d1f23; --muted: #777c86; --line: #e1e3e8; --field: #ebedf0; --read-bg: #fff; --read-text: #1f2125; }
  :root[data-theme="sepia"] { --bg: #eadfc8; --card: #f5ecd9; --text: #4a3b28; --muted: #8a765c; --line: #dccdb0; --field: #e6d9bf; --read-bg: #f1e5cc; --read-text: #4a3b28; }
  :root[data-theme="dark"] { --bg: #16151a; --card: #201f25; --text: #ecebef; --muted: #9a98a3; --line: #302e37; --field: #2a2930; --read-bg: #18171c; --read-text: #d6d4dc; --err: #ef7d73; color-scheme: dark; }
  :root[data-theme="black"] { --bg: #000; --card: #111113; --text: #e8e8ea; --muted: #8d8d94; --line: #242428; --field: #1b1b1e; --read-bg: #000; --read-text: #c9c9ce; --err: #ef7d73; color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] { --bg: #16151a; --card: #201f25; --text: #ecebef; --muted: #9a98a3; --line: #302e37; --field: #2a2930; --read-bg: #18171c; --read-text: #d6d4dc; --err: #ef7d73; color-scheme: dark; }
  }
  :root[data-accent="rose"] { --accent: #c2416b; }
  :root[data-accent="blue"] { --accent: #2f6fd1; }
  :root[data-accent="green"] { --accent: #2e8a57; }
  :root[data-accent="purple"] { --accent: #7b4fc9; }
  :root[data-accent="gray"] { --accent: #5d6470; }
  /* chủ đề tối: màu nhấn sáng hơn cho dễ nhìn */
  /* (máy cũ chưa có color-mix: giữ màu nhấn gốc, nền nhạt dùng màu ô nhập) */
  @supports (color: color-mix(in srgb, red, red)) {
    :root { --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--card)); }
    :root[data-theme="dark"], :root[data-theme="black"] { --accent: color-mix(in srgb, var(--accent-base, #b5543c) 70%, #fff); }
    @media (prefers-color-scheme: dark) { :root[data-theme="auto"] { --accent: color-mix(in srgb, var(--accent-base, #b5543c) 70%, #fff); } }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-text-size-adjust: 100%; min-height: 100vh; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  svg.i { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .wrap { max-width: 720px; margin: 0 auto; padding: calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 28px); }

  /* ===== Thanh trên ===== */
  .top { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 12px; }
  .top h1 { font-size: 28px; line-height: 1.15; margin: 0; flex: 1; min-width: 0; letter-spacing: -.015em; }
  .top h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
  .top .title { flex: 1; min-width: 0; text-align: center; font-weight: 650; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0; }
  .ib:active { transform: scale(.94); }
  .ib.ghost { border-color: transparent; background: transparent; }
  .spacer { width: 44px; flex: none; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 16px; }
  .btn svg.i { width: 20px; height: 20px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.danger { color: var(--err); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; }
  .btn.block { width: 100%; }

  /* ===== Tìm, sắp xếp ===== */
  .tools { display: flex; gap: 8px; margin-bottom: 12px; }
  .search { flex: 1; min-width: 0; position: relative; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 19px; height: 19px; }
  .search input { width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 0 14px 0 40px; font-size: 16px; -webkit-appearance: none; appearance: none; }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; gap: 6px; margin: -2px 0 12px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 550; color: var(--muted); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip small { font-size: 12px; opacity: .7; margin-left: 3px; font-variant-numeric: tabular-nums; }
  .chip.more { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); display: inline-flex; align-items: center; gap: 5px; }
  .chip.more svg { width: 15px; height: 15px; }
  .chip.more.on { color: var(--on-accent); border-color: var(--accent); } /* đang lọc: chữ trắng trên nền màu nhấn (trước bị trùng màu nền) */
  .chip.more.on svg { stroke: var(--on-accent); }
  .filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin: -4px 2px 12px; }
  .filter-bar b { color: var(--text); }
  .filter-bar button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 2px; font-size: 13.5px; }
  /* bảng chọn thể loại */
  .tagq { position: relative; margin-bottom: 10px; }
  .tagq svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
  .tagq input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); padding: 0 12px 0 38px; font-size: 16px; -webkit-appearance: none; appearance: none; }
  .letters { display: flex; flex-wrap: wrap; gap: 3px; margin: 8px 0 6px; }
  .letters button { min-width: 28px; height: 28px; border: 0; border-radius: 7px; background: var(--field); font-size: 12.5px; font-weight: 650; color: var(--text); padding: 0 4px; }
  .letters button:disabled { opacity: .3; }
  .tag-group { margin: 10px 0 4px; }
  .tag-group > b { display: block; font-size: 12.5px; color: var(--muted); margin: 0 2px 6px; }
  .tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-wrap .chip { white-space: normal; text-align: left; }
  .tag-foot { position: sticky; bottom: calc(-16px - var(--safe-b)); background: var(--card); margin: 10px -16px 0; padding: 10px 16px calc(var(--safe-b) + 6px); border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .tag-foot .sum { font-size: 13.5px; color: var(--muted); }
  .tag-foot .sum b { color: var(--text); }
  .tag-foot .row2 { display: flex; gap: 8px; }
  .tag-foot .row2 .btn { flex: 1; min-height: 44px; }
  .imp-file { font-size: 13px; color: var(--muted); font-weight: 500; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imp-sum { font-size: 14px; color: var(--muted); margin: -4px 2px 4px; }
  .imp-sum b { color: var(--text); }
  .imp-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin: 16px 4px 6px; font-size: 14px; }
  .imp-h small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .imp-h .link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; flex: none; }
  .imp-extra { gap: 3px; font-size: 14px; color: var(--muted); max-height: 160px; overflow: auto; }

  .hint { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 12px 12px 12px 14px; margin-bottom: 14px; font-size: 14px; color: var(--muted); display: flex; gap: 10px; align-items: flex-start; }
  .hint b { color: var(--text); }
  .hint .ib { width: 30px; height: 30px; border: 0; background: none; margin: -4px -4px 0 auto; color: var(--muted); }
  .hint .ib svg { width: 18px; height: 18px; }

  /* ===== Tủ sách: danh sách / lưới ===== */
  .list { display: grid; gap: 10px; }
  .card { display: flex; gap: 13px; align-items: stretch; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 18px; padding: 10px; color: var(--text); }
  .card:active { transform: scale(.99); }
  .cover { width: 64px; aspect-ratio: 2 / 3; border-radius: 10px; flex: none; overflow: hidden; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 25px; background: linear-gradient(150deg, var(--c1, #c0705a), var(--c2, #7a3b5c)); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .info { min-width: 0; flex: 1; display: grid; align-content: center; gap: 4px; }
  .card .t { font-weight: 650; font-size: 16px; line-height: 1.32; overflow-wrap: break-word; overflow-wrap: anywhere; }
  .card .a { color: var(--muted); font-size: 13.5px; overflow-wrap: break-word; overflow-wrap: anywhere; }
  .card .m { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .card .tg { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .card .tg span { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .card .tg span.x { background: var(--field); color: var(--muted); }
  .card .d { font-size: 13px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; margin-top: 2px; }
  .card { align-items: flex-start; }
  .card .p { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .bar { height: 5px; border-radius: 5px; background: var(--field); flex: 1; max-width: 130px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
  .reading { color: var(--accent); font-weight: 650; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px; }
  .tile { border: 0; background: none; padding: 0; text-align: left; color: var(--text); display: grid; gap: 6px; }
  .tile .cover { width: 100%; font-size: 34px; border-radius: 12px; box-shadow: 0 4px 14px rgb(0 0 0 / .1); position: relative; }
  .tile .cover .bar { position: absolute; left: 6px; right: 6px; bottom: 6px; max-width: none; background: rgb(255 255 255 / .55); }
  .tile .t { font-size: 13.5px; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; overflow-wrap: anywhere; }
  .tile .a { font-size: 12px; color: var(--muted); margin-top: -3px; overflow-wrap: break-word; overflow-wrap: anywhere; }
  .tile:active { transform: scale(.97); }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .empty { text-align: center; padding: 36px 8px; }
  .empty .big { width: 76px; height: 76px; border-radius: 22px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 14px; }
  .empty .big svg { width: 38px; height: 38px; }
  .empty h2 { margin: 0 0 6px; font-size: 21px; }
  .empty p { color: var(--muted); margin: 0 auto 18px; max-width: 420px; font-size: 15px; }
  .steps { text-align: left; max-width: 440px; margin: 20px auto 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: s; }
  .steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; color: var(--muted); font-size: 14px; }
  .steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  .steps b { color: var(--text); }

  /* ===== Trang truyện ===== */
  .story-head { display: flex; gap: 15px; margin-bottom: 14px; }
  .story-head .cover { width: 108px; font-size: 40px; border-radius: 13px; box-shadow: 0 8px 22px rgb(0 0 0 / .14); }
  .story-head h2 { margin: 2px 0 5px; font-size: 21px; line-height: 1.28; }
  .story-head .a { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
  .story-head .meta { color: var(--muted); font-size: 13.5px; display: grid; gap: 2px; }
  .src-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--accent); font-size: 13.5px; font-weight: 600; text-decoration: none; max-width: 100%; }
  .src-link svg { width: 16px; height: 16px; }
  .src-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .tag { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  button.tag { border: 0; font-family: inherit; display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; }
  button.tag small { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
  button.tag:active { transform: scale(.96); }
  .desc { white-space: pre-wrap; font-size: 14.5px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 6px; max-height: 9.6em; overflow: hidden; position: relative; }
  .desc.open { max-height: none; }
  .desc:not(.open)::after { content: ""; position: absolute; top: auto; right: 0; bottom: 0; left: 0; height: 2.6em; background: linear-gradient(transparent, var(--card)); }
  .more { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 2px 10px; font-size: 14px; }
  .go { width: 100%; margin: 6px 0 18px; }
  .sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 4px 4px 8px; display: flex; justify-content: space-between; }
  .chapters { border: 1px solid var(--line); border-radius: 16px; background: var(--card); overflow: hidden; }
  .ch { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; padding: 12px 14px; min-height: 50px; color: var(--text); }
  .ch:first-child { border-top: 0; }
  .ch .n { color: var(--muted); font-size: 13px; min-width: 2.2em; font-variant-numeric: tabular-nums; }
  .ch .ct { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch .w { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .ch.cur { background: var(--accent-soft); }
  .ch.cur .ct { color: var(--accent); font-weight: 650; }
  .ch.done .ct { color: var(--muted); }

  /* ===== Trang đọc ===== */
  body.reading-mode { background: var(--read-bg); }
  .rtop { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 4px; padding: calc(var(--safe-t) + 4px) 8px 6px; background: var(--read-bg); background: color-mix(in srgb, var(--read-bg) 90%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); transition: transform .22s ease; }
  .rtop.hide { transform: translateY(-110%); }
  .rtop .rt { flex: 1; min-width: 0; text-align: center; line-height: 1.25; }
  .rtop .rt b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 13.5px; font-weight: 650; overflow: hidden; overflow-wrap: break-word; overflow-wrap: anywhere; }
  .rtop .rt small { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rtop .ib { color: var(--text); }
  .page { max-width: 700px; margin: 0 auto; padding: calc(var(--safe-t) + 72px) var(--pad) 26px; color: var(--read-text); font-family: var(--rfont); font-size: var(--fs); line-height: var(--lh); text-align: var(--align); overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
  .page h2 { font-family: var(--font); font-size: 1.15em; line-height: 1.35; margin: 4px 0 1.2em; text-align: left; }
  .page p { margin: 0 0 var(--ps); text-indent: var(--indent); }
  .page p.gap { height: .35em; margin: 0; }
  .page p.sep { text-align: center; text-indent: 0; letter-spacing: .3em; color: var(--muted); margin: 1.2em 0; }
  .page img { max-width: 100%; height: auto; display: block; margin: .6em auto 1em; border-radius: 6px; }
  .page .miss { font-family: var(--font); font-size: 13px; color: var(--muted); text-align: center; text-indent: 0; }
  .endnav { max-width: 700px; margin: 0 auto; padding: 4px var(--pad) calc(var(--safe-b) + 34px); display: grid; gap: 10px; }
  .endnav .row2 { display: flex; gap: 10px; }
  .endnav .row2 .btn { flex: 1; min-width: 0; }
  .endnav .fin { text-align: center; color: var(--muted); font-size: 14px; padding: 8px; }
  .prog { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; height: 3px; pointer-events: none; }
  .prog i { display: block; height: 100%; background: var(--accent); width: 0; }

  /* ===== Bảng trượt (Aa, mục lục) ===== */
  .sheet-bg { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgb(0 0 0 / .35); z-index: 20; animation: fade .15s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 22px 22px 0 0; padding: 8px 16px calc(var(--safe-b) + 16px); max-height: 82vh; overflow: auto; animation: up .2s ease-out; max-width: 720px; margin: 0 auto; box-shadow: 0 -8px 30px rgb(0 0 0 / .15); }
  .sheet .grip { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 10px; }
  .sheet h3 { margin: 2px 0 10px; font-size: 18px; display: flex; align-items: center; justify-content: space-between; }
  .sheet h3 .link { font-size: 14px; font-weight: 600; color: var(--accent); border: 0; background: none; padding: 6px 0; }
  .toc .ch { padding: 12px 6px; }
  @media (min-width: 720px) { .sheet { border-radius: 22px; bottom: 16px; } }

  /* ===== Cài đặt (kiểu danh sách nhóm như app iPhone) ===== */
  .group-t { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; margin: 20px 14px 7px; }
  .group-f { font-size: 12.5px; color: var(--muted); margin: 7px 14px 0; line-height: 1.45; }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; min-height: 52px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: var(--text); }
  .item:first-child { border-top: 0; }
  .item > .lbl { flex: 1; min-width: 0; }
  .item > .lbl small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; margin-top: 1px; }

/* ===== Cài đặt: lưu trong IndexedDB (chính) + localStorage (để mở app là có màu ngay) ===== */
const DEFAULTS = { theme: 'auto', accent: 'terra', font: 'serif', fs: 19, lh: 1.75, ps: 0.8, pad: 'medium', justify: false, indent: false,

const THEMES = [['auto', 'Tự động', '#f6f1e7', '#16151a'], ['paper', 'Giấy', '#fbf6ec'], ['light', 'Sáng', '#ffffff'], ['sepia', 'Nâu', '#f1e5cc'], ['dark', 'Tối', '#18171c'], ['black', 'Đen', '#000000']];
const ACCENTS = [['terra', 'Đất nung', '#b5543c'], ['rose', 'Hồng', '#c2416b'], ['blue', 'Xanh dương', '#2f6fd1'], ['green', 'Xanh lá', '#2e8a57'], ['purple', 'Tím', '#7b4fc9'], ['gray', 'Xám', '#5d6470']];

/* ===== IndexedDB ===== */
let dbp = null;
function db() {
  if (dbp) return dbp;
  return dbp = new Promise((ok, bad) => {
    const r = indexedDB.open('doc-truyen', 2); // bản 2: thêm “drafts” (bản nháp viết trên điện thoại)

      else if (meta.read?.chapter && has(String(meta.read.chapter))) os('pos').put({ id, chapter: String(meta.read.chapter), offset: Math.min(1, Math.max(0, Number(meta.read.offset) || 0)), at: 0 });
      else os('pos').delete(id);
      final.push(meta);
    }
    for (const s of extra) if (!del.includes(s)) final.push(s);
    for (const s of del) { removeStory(s.id); os('pos').delete(s.id); favs.delete(s.id); }
    final.forEach((s, i) => os('stories').put({ ...s, order: i }));
    os('meta').put([...favs], 'favs');
    os('meta').put({ imported: new Date().toISOString(), exported: kho.exported || '', file: file.name, stories: final.length, chapters: final.reduce((a, s) => a + s.chapters.length, 0) }, 'info');
    await done(tx);
    await load();
    hideBusy();
    S.view = 'list'; S.sid = S.cid = null; S.tags = []; S.tagq = '';
    history.replaceState({ view: 'list' }, '', location.pathname + location.search);
    render();
    const msg = [added && `thêm ${num(added)} truyện`, updated && `cập nhật ${num(updated)} truyện`, copied && `tạo ${num(copied)} truyện mới từ bản trùng`, del.length && `xoá ${num(del.length)} truyện`].filter(Boolean).join(', ');
    toast(`✓ Đã ${msg}. File trong app Tệp xoá đi được rồi nhé`);
  } catch (e) {
    hideBusy();
    toast(e?.name === 'QuotaExceededError' ? 'Điện thoại hết chỗ lưu, kho cũ vẫn giữ nguyên. Dọn bớt bộ nhớ rồi thử lại nhé' : (e?.message || 'Không nhập được file') + ' · Kho cũ vẫn giữ nguyên', true);
  }
}

async function wipe() {
  if (!confirm('Xoá toàn bộ truyện và chỗ đang đọc trên máy này? (Truyện trên máy tính không bị ảnh hưởng, bản nháp ở mục Viết vẫn giữ)')) return;
  const d = await db();
  const tx = d.transaction(['stories', 'texts', 'images', 'pos', 'meta'], 'readwrite');
  for (const n of ['stories', 'texts', 'images', 'pos']) tx.objectStore(n).clear(); // bản nháp (Viết) vẫn giữ
  tx.objectStore('meta').delete('info'); tx.objectStore('meta').delete('favs');
  await done(tx);
  await load();
  S.view = 'list'; history.replaceState({ view: 'list' }, '', location.pathname + location.search); render(); toast('Đã xoá toàn bộ truyện');
}
async function resetPos() {
  if (!confirm('Xoá chỗ đang đọc của mọi truyện? Truyện vẫn còn, chỉ bỏ đánh dấu đã đọc tới đâu.')) return;
  const d = await db(); const tx = d.transaction('pos', 'readwrite'); tx.objectStore('pos').clear(); await done(tx);
  await load(); render(); toast('Đã xoá chỗ đang đọc');
}

async function saveFavs() { await put('meta', [...S.favs], 'favs'); }
async function toggleFav(id) {
  const on = !S.favs.has(id);
  if (on) S.favs.add(id); else S.favs.delete(id);
  try { await saveFavs(); } catch {}
  const b = $app.querySelector('[data-act=fav]');
  if (b) { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Bỏ khỏi Yêu thích' : 'Thêm vào Yêu thích'); }
  updateTabbar();
  toast(on ? '♥ Đã thêm vào Yêu thích' : 'Đã bỏ khỏi Yêu thích');
}
async function deleteStory(id) {
  const s = story(id);
  if (!s || !confirm(`Xoá truyện “${s.title}” khỏi điện thoại?

Xoá cả ${s.chapters.length} chương và chỗ đang đọc. Truyện trên máy tính không bị ảnh hưởng, muốn đọc lại thì nhập kho lại.`)) return;
  const d = await db();
  const tx = d.transaction(['stories', 'texts', 'images', 'pos', 'meta'], 'readwrite');
  const r = IDBKeyRange.bound(id + '\n', id + '\n￿');
  tx.objectStore('stories').delete(id); tx.objectStore('texts').delete(r); tx.objectStore('images').delete(r); tx.objectStore('pos').delete(id);
  S.favs.delete(id); tx.objectStore('meta').put([...S.favs], 'favs');
  await done(tx);
  await load();
  toast(`Đã xoá “${s.title}”`);
  if (history.state?.view === 'story') history.back(); else { S.view = 'list'; render(); }
}

/* ===== Vẽ giao diện ===== */
const initial = t => (String(t || '?').replace(/^[\s【\[(（「『]+/, '').trim()[0] || '?').toUpperCase();
function hue(t) { let h = 0; for (const c of String(t)) h = (h * 31 + c.codePointAt(0)) % 360; return h; }
function coverHtml(s, extra = '') {
  if (s.cover) return `<div class="cover"><img src="${esc(s.cover)}" alt="">${extra}</div>`;
  const h = hue(s.title);
  return `<div class="cover" style="--c1:hsl(${h} 45% 52%);--c2:hsl(${(h + 50) % 360} 40% 34%)">${esc(initial(s.title))}${extra}</div>`;
}
function progress(s) {
  const p = S.pos.get(s.id), n = s.chapters.length;
  if (!p || !n) return null;
  const i = s.chapters.findIndex(c => c.id === p.chapter);
  if (i < 0) return null;
  return { i, n, ratio: (i + (p.offset || 0)) / n };
}
const pct = r => Math.min(100, Math.round(r * 100)) + '%';
function render() {
  document.body.classList.toggle('reading-mode', S.view === 'read');
  releaseWake();
  flushDraft();
  if (S.view === 'settings') settingsView();
  else if (S.view === 'story' && story(S.sid)) storyView();
  else if (S.view === 'read' && story(S.sid)) readView();
  else if (S.view === 'draft' && draft(S.did)) draftView();
  else if (S.view === 'chap' && draft(S.did)?.chapters.some(c => c.id === S.chid)) chapView();
  else if (['drafts', 'draft', 'chap'].includes(S.view)) { S.view = 'drafts'; draftsView(); }
  else { if (S.view !== 'favs') S.view = 'list'; listView(); }
  updateTabbar();
}

    ${S.tags.length || S.q.trim() ? `<div class="filter-bar"><span><b>${num(rows.length)}</b> truyện khớp${S.tags.length > 1 ? ` · ${prefs.tagAll ? 'có đủ' : 'có một trong'} ${S.tags.length} thể loại` : ''}</span>${S.tags.length ? '<button data-act="tag-clear">Bỏ lọc thể loại</button>' : ''}</div>` : ''}

function tagCounts(base = S.view === 'favs' ? S.stories.filter(s => S.favs.has(s.id)) : S.stories) {

  return [...m].map(([name, n]) => ({ name, n }));

function shown(base = S.view === 'favs' ? S.stories.filter(s => S.favs.has(s.id)) : S.stories) {

    && (!S.tags.length || (prefs.tagAll ? S.tags.every(t => s.categories.includes(t)) : S.tags.some(t => s.categories.includes(t)))));

function paragraphs(text, images) {
  const out = [];
  let gap = false;
  for (const raw of String(text).split('\n')) {
    const line = raw.trim();
    if (!line) { gap = out.length > 0; continue; }
    if (gap) { out.push('<p class="gap"></p>'); gap = false; }
    const m = /^\[ảnh:([A-Za-z0-9_-]{1,40}\.(?:png|jpg|jpeg|gif|bmp|webp))\]$/i.exec(line);
    if (m) out.push(images.get(m[1]) ? `<img src="${esc(images.get(m[1]))}" alt="">` : '<p class="miss">(ảnh không có trong kho)</p>');
    else if (line === '* * *') out.push('<p class="sep">* * *</p>');
    else out.push(`<p>${esc(line)}</p>`);
  }
  return out.join('');
}

// Xuất bản nháp thành file .wmkho (cùng định dạng app máy tính nhập được), gửi qua bảng Chia sẻ của iPhone hoặc tải về
let exportFile = null;
async function exportDrafts(list) {
  await flushDraft();
  const items = list.map(d => ({ d, chs: d.chapters.filter(c => c.text.trim()) })).filter(x => x.chs.length);
  if (!items.length) { toast('Chưa có chương nào có chữ để xuất', true); return; }
  showBusy('Đang tạo file…');
  try {
    const kho = { format: FORMAT, version: 1, exported: new Date().toISOString(), source: 'doc-truyen-web',
      stories: items.map(({ d, chs }) => ({ id: d.id, title: d.title.trim() || 'Truyện chưa đặt tên', author: d.author.trim(), link: '', categories: catsOf(d),
        description: d.description.trim(), updated: d.updated, cover: null, read: null,
        chapters: chs.map(c => ({ id: c.id, title: c.title.trim() || `Chương ${d.chapters.indexOf(c) + 1}`, words: wc(c.text), text: c.text.replace(/\r\n?/g, '\n') })), images: {} })) };
    let blob = new Blob([JSON.stringify(kho)], { type: 'application/json' });
    if (typeof CompressionStream !== 'undefined') blob = await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();
    const t = new Date(), p2 = x => String(x).padStart(2, '0');
    const stamp = `${t.getFullYear()}-${p2(t.getMonth() + 1)}-${p2(t.getDate())}-${p2(t.getHours())}${p2(t.getMinutes())}`;
    const base = items.length === 1 ? plain(items[0].d.title).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'BanNhap' : 'BanNhap';
    exportFile = new File([blob], `${base}-${stamp}.wmkho`, { type: 'application/octet-stream' });
    hideBusy();
    const nch = items.reduce((a, x) => a + x.chs.length, 0), skipped = list.reduce((a, d) => a + d.chapters.length, 0) - nch;
    let canShare = false; try { canShare = !!navigator.canShare?.({ files: [exportFile] }); } catch {}
    const size = exportFile.size < 1024 ? exportFile.size + ' B' : exportFile.size < 1048576 ? Math.ceil(exportFile.size / 1024) + ' KB' : (exportFile.size / 1048576).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' MB';
    openSheet(`<h3>Xuất bản nháp</h3>
      <div class="group"><div class="item"><span class="ico">${icon('file')}</span><span class="lbl">${esc(exportFile.name)}<small>${num(items.length)} truyện · ${num(nch)} chương · ${size}${skipped ? ` · bỏ ${num(skipped)} chương trống` : ''}</small></span></div></div>
      <div class="row-btns" style="margin-top:12px">${canShare ? `<button class="btn primary" data-act="share-file">${icon('share')}Gửi file</button>` : ''}<button class="btn${canShare ? '' : ' primary'}" data-act="dl-file">${icon('import')}Tải file về</button></div>
      <div class="note" style="margin-top:0">Gửi file qua <b>Zalo</b> sang máy tính (hoặc <b>Lưu vào Tệp</b>). Trên máy tính: <b>Kho truyện → 📥 Nhập truyện</b> → kéo file vào là xong.</div>`);
  } catch (e) { hideBusy(); toast('Không tạo được file: ' + (e?.message || ''), true); }
}
async function shareFile() {
  if (!exportFile) return;
  try { await navigator.share({ files: [exportFile], title: exportFile.name }); closeSheet(); }
  catch (e) { if (e?.name !== 'AbortError') toast('Không mở được bảng chia sẻ, thử “Tải file về” nhé', true); }
}
function downloadFile() {
  if (!exportFile) return;
  const u = URL.createObjectURL(exportFile), a = document.createElement('a');
  a.href = u; a.download = exportFile.name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
  closeSheet(); toast('Đã tải file ' + exportFile.name);
}

  document.querySelector('.toc .cur')?.scrollIntoView({ block: 'center' });
}

/* ===== Cài đặt ===== */
const seg = (k, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-set="${k}" data-v="${v}" class="${String(prefs[k]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const toggle = (k, label, sub) => `<label class="item"><span class="lbl">${label}${sub ? `<small>${sub}</small>` : ''}</span><span class="switch"><input type="checkbox" data-set="${k}"${prefs[k] ? ' checked' : ''}><i></i></span></label>`;
const range = (k, label, min, max, step, fmt, lo, hi) => `<div class="item stack"><div class="head"><span>${label}</span><span class="val" data-val="${k}">${fmt(prefs[k])}</span></div>
  <div class="range"><span>${lo}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${prefs[k]}" data-set="${k}" data-fmt="${k}" aria-label="${label}"><span>${hi}</span></div></div>`;
const FMT = { fs: v => v + ' px', lh: v => Number(v).toFixed(2).replace(/0$/, ''), ps: v => Number(v).toFixed(1) + ' dòng' };
function themeItem() {
  return `<div class="item stack"><span>Chủ đề</span><div class="swatches">${THEMES.map(([k, l, c1, c2]) => `<button class="sw${prefs.theme === k ? ' on' : ''}" data-set="theme" data-v="${k}"><i style="background:${c2 ? `linear-gradient(135deg, ${c1} 50%, ${c2} 50%)` : c1}"></i>${l}</button>`).join('')}</div></div>`;
}
function fontItems(short) {
  return `<div class="item stack"><span>Phông chữ</span>${seg('font', Object.entries(FONTS).map(([k, [l]]) => [k, l]))}</div>
    ${range('fs', 'Cỡ chữ', 14, 30, 1, FMT.fs, 'A', '<b style="font-size:18px">A</b>')}
    ${short ? '' : range('lh', 'Giãn dòng', 1.3, 2.4, 0.05, FMT.lh, '≡', '☰')}
    ${short ? '' : range('ps', 'Cách đoạn', 0, 2, 0.1, FMT.ps, '', '')}`;
}
async function settingsView() {
  const m = S.meta, chapters = S.stories.reduce((a, s) => a + s.chapters.length, 0);
  $app.innerHTML = `<div class="wrap">${S.from && !TOP.includes(S.from) ? `<div class="top"><button class="ib" data-act="back" aria-label="Quay lại">${icon('back')}</button><span class="title">Cài đặt</span><span class="spacer"></span></div>` : '<div class="top"><h1>Cài đặt</h1></div>'}
    <div class="group-t">Giao diện</div>
    <div class="group">${themeItem()}
      <div class="item stack"><span>Màu nhấn</span><div class="dots">${ACCENTS.map(([k, l, c]) => `<button class="dot${prefs.accent === k ? ' on' : ''}" style="background:${c}" data-set="accent" data-v="${k}" aria-label="${l}" title="${l}"></button>`).join('')}</div></div></div>
    <div class="group-f">“Tự động” đổi sáng / tối theo cài đặt sáng / tối của điện thoại.</div>

    <div class="group-t">Trang đọc</div>
    <div class="group">
      <div class="item stack"><div class="preview" data-preview><p>Mưa bắt đầu rơi khi cô bước ra khỏi thư viện, những giọt nước lách tách trên mái hiên cũ.</p><p>“Lại quên ô rồi,” cô thở dài, nhìn bầu trời xám bạc phía xa.</p></div></div>
      ${fontItems(false)}
      <div class="item stack"><span>Lề hai bên</span>${seg('pad', Object.entries(PADS).map(([k, [l]]) => [k, l]))}</div>
      ${toggle('justify', 'Căn đều hai bên')}
      ${toggle('indent', 'Thụt đầu dòng')}
    </div>

    <div class="group-t">Khi đọc</div>
    <div class="group">
      ${toggle('autoHide', 'Ẩn thanh trên khi cuộn xuống', 'Cuộn lên một chút là hiện lại')}
      ${toggle('keepAwake', 'Giữ màn hình luôn sáng', 'Màn hình không tự tắt khi đang đọc (tốn pin hơn)')}
    </div>

    <div class="group-t">Tủ sách</div>
    <div class="group">
      <div class="item stack"><span>Sắp xếp</span>${seg('sort', [['recent', 'Đọc gần đây'], ['kho', 'Theo kho'], ['az', 'Tên A–Z']])}</div>
      <div class="item stack"><span>Kiểu hiển thị</span>${seg('layout', [['list', 'Danh sách'], ['grid', 'Lưới bìa']])}</div>
      ${toggle('showTags', 'Hiện thể loại trên thẻ truyện')}
      ${toggle('showDesc', 'Hiện giới thiệu ngắn', 'Hai dòng đầu của phần giới thiệu, dạng danh sách')}
    </div>

    <div class="group-t">Dữ liệu trên máy</div>
    <div class="group">
      <div class="stat"><div><b>${num(S.stories.length)}</b><small>truyện</small></div><div><b>${num(chapters)}</b><small>chương</small></div><div><b data-used>…</b><small>đang dùng</small></div></div>
      ${m ? `<div class="item"><span class="lbl">Kho hiện tại<small>${esc(m.file)} · nhập lúc ${new Date(m.imported).toLocaleString('vi-VN')}</small></span></div>` : ''}
      <div class="item"><span class="lbl">Lưu trữ lâu dài<small data-persist>Đang kiểm tra…</small></span></div>
      <button class="item act" data-act="import"><span class="ico">${icon('import')}</span><span class="lbl">Nhập kho mới<small style="color:var(--muted);font-weight:400">Xem truyện mới / trùng rồi chọn, vẫn giữ chỗ đang đọc</small></span></button>
      ${S.pos.size ? `<button class="item act" data-act="reset-pos"><span class="ico">${icon('undo')}</span><span class="lbl">Xoá chỗ đang đọc</span></button>` : ''}
      ${S.stories.length ? `<button class="item act danger" data-act="wipe"><span class="ico">${icon('trash')}</span><span class="lbl">Xoá toàn bộ truyện</span></button>` : ''}
    </div>
    <div class="group-f">Truyện chỉ nằm trong máy này, không gửi lên mạng. Xoá biểu tượng app trên màn hình chính cũng xoá hết dữ liệu.</div>

    <div class="group-t">Khác</div>
    <div class="group">
      ${toggle('hint', 'Hiện gợi ý “Thêm vào MH chính”', 'Chỉ hiện khi mở bằng tab trình duyệt thường')}
      <button class="item act" data-act="reset-prefs"><span class="ico">${icon('undo')}</span><span class="lbl">Khôi phục cài đặt mặc định</span></button>
    </div>
    <div class="about">Đọc truyện · phiên bản ${APP_VERSION}<br>${standalone() ? 'Đang chạy như ứng dụng trên màn hình chính' : 'Đang mở trong trình duyệt'}</div></div>`;
  scrollTo(0, S.setY || 0); S.setY = null;
  try {
    const e = await navigator.storage?.estimate?.(), u = e?.usage;
    const b = document.querySelector('[data-used]');
    if (b) b.textContent = u == null ? '—' : u < 1e6 ? '< 1 MB' : (u / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' MB';
  } catch {}
  try {
    const p = await navigator.storage?.persisted?.();
    const x = document.querySelector('[data-persist]');
    if (x) x.textContent = p ? `✓ Đã bật: ${isIos() ? 'iPhone' : 'máy'} không tự xoá truyện khi thiếu bộ nhớ` : standalone() ? `Chưa bật (bật tự động khi nhập kho, tuỳ phiên bản ${isIos() ? 'iOS' : 'trình duyệt'})` : 'Mở từ biểu tượng trên màn hình chính để dữ liệu được giữ lâu dài';
  } catch {}
}
function setPref(k, v) {
  prefs[k] = typeof DEFAULTS[k] === 'number' ? Number(v) : typeof DEFAULTS[k] === 'boolean' ? !!v : v;
  savePrefs();
  if (k === 'keepAwake') { if (prefs.keepAwake) requestWake(); else releaseWake(); }
}
function refreshSettingsUi(k) {
  // vẽ lại nút được chọn mà không làm mất chỗ cuộn
  if (S.view === 'settings') { S.setY = scrollY; settingsView(); }
  else if (document.querySelector('.sheet')) { const y = document.querySelector('.sheet').scrollTop; aaSheet(); document.querySelector('.sheet').scrollTop = y; document.querySelector('.sheet').style.animation = 'none'; document.querySelector('.sheet-bg').style.animation = 'none'; }
  if (S.view === 'read') { const r = ratio(); requestAnimationFrame(() => { scrollTo(0, r * maxY()); updateProg(); }); }
}

/* ===== Thông báo ===== */
let toastTimer = 0;
function toast(text, err, action) {
  document.querySelector('.toast')?.remove();
  clearTimeout(toastTimer);
  document.body.insertAdjacentHTML('beforeend', `<div class="toast${err ? ' err' : ''}" role="status"><span>${esc(text)}</span>${action ? `<button data-act="${action[0]}">${esc(action[1])}</button>` : ''}</div>`);
  if (!action) toastTimer = setTimeout(() => document.querySelector('.toast')?.remove(), err ? 6000 : 3500);
}
function showBusy(text) { hideBusy(); document.body.insertAdjacentHTML('beforeend', `<div class="busy"><div><span class="spin"></span>${esc(text)}</div></div>`); }
function hideBusy() { document.querySelector('.busy')?.remove(); }

/* ===== Sự kiện ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act], button[data-set]');
  if (!t || t.disabled) return;
  if (t.dataset.set === 'tagAll') { setPref('tagAll', t.dataset.v === 'true'); refreshTagSheet(); listView(true); return; }
  if (t.dataset.set) { setPref(t.dataset.set, t.dataset.v); refreshSettingsUi(t.dataset.set); return; }
  const a = t.dataset.act;
  if (a === 'import') { closeSheet(); pickFile(); }
  else if (a === 'settings') { closeSheet(); if (S.view === 'read') savePos(true); go({ view: 'settings' }); }
  else if (a === 'aa') aaSheet();
  else if (a === 'close') { closeSheet(); pending = null; }
  else if (a === 'imp-go') { if (pending) applyImport(); }
  else if (a === 'imp-cancel') { closeSheet(); pending = null; toast('Đã huỷ, tủ sách giữ nguyên'); }
  else if (a === 'pick-all') { const l = pending.rows.filter(r => r.kind === t.dataset.k), v = !l.every(r => r.mode !== 'skip'); l.forEach(r => { r.mode = v ? 'add' : 'skip'; }); refreshImportSheet(); }
  else if (a === 'imp-mode') { const r = pending?.rows.find(r => r.i === Number(t.dataset.i)); if (r) { r.mode = t.dataset.m; refreshImportSheet(); } }
  else if (a === 'mode-all') { pending?.rows.filter(r => r.kind === t.dataset.k).forEach(r => { r.mode = t.dataset.m; }); refreshImportSheet(); }
  else if (a === 'wipe') wipe();
  else if (a === 'reset-pos') resetPos();
  else if (a === 'reset-prefs') { if (confirm('Đưa mọi cài đặt (chủ đề, phông chữ, cỡ chữ…) về mặc định?')) { prefs = { ...DEFAULTS }; savePrefs(); refreshSettingsUi(); toast('Đã khôi phục cài đặt mặc định'); } }
  else if (a === 'hint-x') { prefs.hint = false; savePrefs(); t.closest('.hint')?.remove(); }
  else if (a === 'layout') { prefs.layout = prefs.layout === 'grid' ? 'list' : 'grid'; savePrefs(); const y = scrollY; listView(); scrollTo(0, Math.min(y, maxY())); }
  else if (a === 'tag') { const k = t.dataset.tag; S.tags = S.tags.includes(k) ? S.tags.filter(x => x !== k) : [...S.tags, k]; listView(true); refreshTagSheet(); } // chỉ vẽ lại danh sách: giữ chỗ cuộn trang + hàng thể loại
  else if (a === 'tag-clear') { S.tags = []; listView(true); refreshTagSheet(); }
  else if (a === 'tab') {
    closeSheet();
    const v = t.dataset.v;
    if (S.view === v) { scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (S.view === 'read') savePos(true);
    if (v === 'list' || v === 'favs') { S.tags = []; S.q = ''; }
    go({ view: v, from: null }, TOP.includes(S.view)); // đổi tab: không chồng lịch sử
    if (v !== 'settings') scrollTo(0, 0);
  }
  else if (a === 'fav') toggleFav(S.sid);
  else if (a === 'del-story') deleteStory(S.sid);
  else if (a === 'new-draft') newDraft();
  else if (a === 'open-draft') go({ view: 'draft', did: t.dataset.id });
  else if (a === 'open-chap') { S.draftY = scrollY; go({ view: 'chap', chid: t.dataset.cid }); }
  else if (a === 'add-chap') { if (S.view === 'draft') S.draftY = scrollY; addChap(); }
  else if (a === 'move-chap') moveChap(t.dataset.cid, Number(t.dataset.d));
  else if (a === 'step-chap') { const d = draft(S.did), i = d.chapters.findIndex(c => c.id === S.chid) + Number(t.dataset.d); if (d.chapters[i]) go({ view: 'chap', chid: d.chapters[i].id }, true); }
  else if (a === 'del-chap') delChap();
  else if (a === 'del-draft') delDraft();
  else if (a === 'export-draft') exportDrafts([draft(S.did)].filter(Boolean));
  else if (a === 'export-drafts') exportDrafts(S.drafts);
  else if (a === 'share-file') shareFile();
  else if (a === 'dl-file') downloadFile();
  else if (a === 'tag-go') { S.tags = [t.dataset.tag]; S.q = ''; S.listY = 0; go({ view: 'list' }); scrollTo(0, 0); } // bấm thể loại trong trang truyện: danh sách truyện cùng thể loại, nút quay lại về truyện
  else if (a === 'tags') { S.tagq = ''; tagSheet(); }
  else if (a === 'tag-letter') document.querySelector(`.sheet [data-group="${t.dataset.l}"]`)?.scrollIntoView({ block: 'start', behavior: 'smooth' });
  else if (a === 'story') { S.listY = scrollY; go({ view: 'story', sid: t.dataset.id }); }
  else if (a === 'more') { $app.querySelector('[data-desc]')?.classList.add('open'); t.remove(); }
  else if (a === 'read') { closeSheet(); if (t.dataset.fresh || S.view === 'story') S.restore = t.dataset.cid === S.pos.get(S.sid)?.chapter; go({ view: 'read', sid: S.sid, cid: t.dataset.cid }, S.view === 'read'); } // đổi chương trong lúc đọc: nút quay lại vẫn về trang truyện
  else if (a === 'go') { const s = story(S.sid), i = s.chapters.findIndex(c => c.id === S.cid) + Number(t.dataset.step); if (s.chapters[i]) { savePos(true); S.restore = false; go({ view: 'read', sid: S.sid, cid: s.chapters[i].id }, true); } }
  else if (a === 'toc') toc();
  else if (a === 'back') history.back();
  else if (a === 'update') location.reload();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-tagq]')) { S.tagq = t.value; refreshTagSheet(); return; }
  if (t.matches('[data-q]')) { S.q = t.value; listView(true); return; }
  if (t.matches('[data-df]')) { const d = draft(S.did); if (d) { d[t.dataset.df] = t.value; saveDraftSoon(d); if (t.dataset.df === 'author') try { localStorage.setItem('draft-author', t.value.trim()); } catch {} } return; }
  if (t.matches('[data-cf]')) {
    const d = draft(S.did), c = d?.chapters.find(c => c.id === S.chid);
    if (c) { c[t.dataset.cf] = t.value; saveDraftSoon(d); if (t.dataset.cf === 'text') { grow(t); const w = $app.querySelector('[data-wc]'); if (w) w.textContent = num(wc(t.value)) + ' từ'; } }
    return;
  }
  if (t.matches('input[type=range][data-set]')) {
    setPref(t.dataset.set, t.value);
    const v = document.querySelector(`[data-val="${t.dataset.set}"]`); if (v) v.textContent = FMT[t.dataset.set](prefs[t.dataset.set]);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[type=checkbox][data-set]')) setPref(t.dataset.set, t.checked);
  if (t.matches('[data-pick]') && pending) { const r = pending.rows.find(r => r.i === Number(t.dataset.pick)); if (r) r.mode = t.checked ? 'add' : 'skip'; refreshImportSheet(); }
  if (t.matches('[data-drop]') && pending) { pending.drop = t.checked; refreshImportSheet(); }
  if (t.matches('input[type=range][data-set]') && S.view === 'read') { const r = ratio(); requestAnimationFrame(() => scrollTo(0, r * maxY())); }
});

/* ===== Điều hướng: dùng lịch sử trình duyệt để vuốt / nút quay lại hoạt động ===== */
function hashOf(st) {
  const e = encodeURIComponent;
  return st.view === 'list' ? location.pathname + location.search : st.view === 'settings' ? '#cai-dat' : st.view === 'favs' ? '#yeu-thich' : st.view === 'drafts' ? '#viet'
    : st.view === 'draft' ? `#viet=${e(st.did)}` : st.view === 'chap' ? `#viet=${e(st.did)}&ch=${e(st.chid)}` : st.view === 'story' ? `#s=${e(st.sid)}` : `#s=${e(st.sid)}&c=${e(st.cid)}`;
}
function go(state, replace) {
  if (S.view === 'read') savePos(true);
  if (state.view === 'settings') { state.sid = S.sid; state.cid = S.cid; state.from = S.view; }
  if (state.view === 'chap' || state.view === 'draft') state.did = state.did ?? S.did;
  Object.assign(S, state);
  history[replace ? 'replaceState' : 'pushState']({ view: state.view, sid: state.sid ?? null, cid: state.cid ?? null, did: state.did ?? null, chid: state.chid ?? null, from: state.from ?? null }, '', hashOf(state));
  render();
}
addEventListener('popstate', e => {
  if (S.view === 'read') savePos(true);
  const st = e.state || { view: 'list' };
  const was = S.view;
  S.view = st.view; S.sid = st.sid; S.cid = st.cid; S.did = st.did ?? null; S.chid = st.chid ?? null; S.from = st.from ?? null;
  if (st.view === 'list' || st.view === 'favs') S.tags = Array.isArray(st.tags) ? st.tags : [];
  closeSheet();
  render();
  if (isListView() && !TOP.includes(was) && S.listY != null) scrollTo(0, S.listY);
  else if (S.view === 'draft' && was === 'chap') scrollTo(0, S.draftY || 0);
});

(async () => {
  try {
    await load();
  } catch (e) {
    $app.innerHTML = `<div class="wrap"><div class="empty"><div class="big">${icon('x')}</div><h2>Không mở được bộ nhớ</h2><p>${esc(e.message)}. Nếu đang ở chế độ duyệt web riêng tư, mở trang ở tab thường nhé.</p></div></div>`;
    return;
  }
  // Mở lại đúng trang đang xem (khi tải lại trang)
  const raw = location.hash.slice(1), h = new URLSearchParams(raw);
  const sid = h.get('s'), cid = h.get('c');
  history.replaceState({ view: 'list' }, '', location.pathname + location.search);
  if (sid && story(sid)) {
    history.pushState({ view: 'story', sid, cid: null }, '', `#s=${encodeURIComponent(sid)}`);
    if (cid && story(sid).chapters.some(c => c.id === cid)) { history.pushState({ view: 'read', sid, cid }, '', `#s=${encodeURIComponent(sid)}&c=${encodeURIComponent(cid)}`); Object.assign(S, { view: 'read', sid, cid }); }
    else Object.assign(S, { view: 'story', sid });
  } else if (raw === 'cai-dat' || raw === 'yeu-thich') { const v = raw === 'cai-dat' ? 'settings' : 'favs'; history.replaceState({ view: v }, '', '#' + raw); S.view = v; }
  else if (h.has('viet')) {
    history.replaceState({ view: 'drafts' }, '', '#viet'); S.view = 'drafts';
    const did = h.get('viet'), chid = h.get('ch'), d = did && draft(did);
    if (d) {
      history.pushState({ view: 'draft', did }, '', `#viet=${encodeURIComponent(did)}`); Object.assign(S, { view: 'draft', did });
      if (chid && d.chapters.some(c => c.id === chid)) { history.pushState({ view: 'chap', did, chid }, '', `#viet=${encodeURIComponent(did)}&ch=${encodeURIComponent(chid)}`); Object.assign(S, { view: 'chap', chid }); }
    }
  }
  render();
})();

// Lưu giao diện vào máy để mở được khi không có mạng; có bản mới thì báo để tải lại
if ('serviceWorker' in navigator) addEventListener('load', async () => {
  try {
    const had = !!navigator.serviceWorker.controller;
    const reg = await navigator.serviceWorker.register('sw.js');
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('Đã có bản mới của app', false, ['update', 'Tải lại']); });
    reg.update().catch(() => {});
  } catch {}
});
</script>
